name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      # Own renderer: lowlighter/metrics' repo query times out for 67 repos and then renders "0 Languages".
      # See .github/scripts/languages-card.mjs for details. The script exits non-zero instead of writing an empty card.
      - name: Languages card
        env:
          GH_TOKEN: ${{ secrets.METRICS_TOKEN }}
        run: node .github/scripts/languages-card.mjs github-languages.svg

      - name: Commit languages card
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add github-languages.svg
          git diff --cached --quiet || { git commit -m "Update github-languages.svg - [Skip GitHub Action]" && git push; }

      - name: Streak card
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-streak.svg
          base: ""
          config_timezone: Europe/Berlin
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
