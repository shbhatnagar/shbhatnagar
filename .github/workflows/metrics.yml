name: Metrics
on:
  schedule:
    - cron: "0 0 * * *"
  workflow_dispatch:
  push:
    branches: [main]

jobs:
  metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Languages card
        uses: lowlighter/metrics@latest
        with: &languages
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-languages.svg
          base: ""
          config_animations: no
          plugin_languages: yes
          plugin_languages_indepth: no
          plugin_languages_categories: programming, data
          plugin_languages_sections: most-used
          plugin_languages_details: percentage, bytes-size
          plugin_languages_limit: 0
          repositories_affiliations: owner, collaborator, organization_member
          repositories_forks: yes
          # ponytail: metrics stops paging after any page < 100 repos, so batch must cover all repos (67 now) in one page.
          # Big pages time out (~1 in 8 at 70) and metrics then silently renders "0 Languages", hence the check + retries below.
          # Upgrade path: raise this if repo count passes 70.
          repositories_batch: 70

      - name: Check languages card
        id: check1
        continue-on-error: true
        env: &gh
          GH_TOKEN: ${{ github.token }}
        run: &check |
          svg=$(gh api "repos/$GITHUB_REPOSITORY/contents/github-languages.svg" --jq .content | base64 -d)
          if grep -qE '^[[:space:]]*0 Languages' <<<"$svg"; then
            echo "::error::Languages card rendered with 0 languages"
            exit 1
          fi

      - name: Languages card (retry 1)
        if: steps.check1.outcome == 'failure'
        uses: lowlighter/metrics@latest
        with: *languages

      - name: Check languages card (retry 1)
        id: check2
        if: steps.check1.outcome == 'failure'
        continue-on-error: true
        env: *gh
        run: *check

      - name: Languages card (retry 2)
        if: steps.check2.outcome == 'failure'
        uses: lowlighter/metrics@latest
        with: *languages

      - name: Check languages card (retry 2)
        if: steps.check2.outcome == 'failure'
        env: *gh
        run: *check

      - name: Streak card
        if: ${{ !cancelled() }}
        uses: lowlighter/metrics@latest
        with:
          token: ${{ secrets.METRICS_TOKEN }}
          filename: github-streak.svg
          base: ""
          config_timezone: Europe/Berlin
          config_animations: no
          plugin_isocalendar: yes
          plugin_isocalendar_duration: half-year
